name: CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'بناء ملف APK للتحميل'
        type: boolean
        default: true
      run_tests:
        description: 'تشغيل الاختبارات'
        type: boolean
        default: true

jobs:
  analyze:
    name: تحليل الشيفرة
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # قناة stable تضمن أحدث إصدار مستقر (يحتاج المشروع Dart ‏3.8.1 أو أحدث)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: معلومات البيئة
        run: flutter --version
      - name: تحضير الحزم
        run: flutter pub get
      - name: التحليل
        run: flutter analyze
      - name: الاختبارات
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: flutter test --reporter expanded

  apk:
    name: بناء APK
    needs: analyze
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: تحضير الحزم
        run: flutter pub get
      - name: بناء نسخة الإصدار
        run: flutter build apk --release
      - name: رفع الملف
        uses: actions/upload-artifact@v4
        with:
          name: injazi-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
