name: CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'بناء ملف APK للتحميل'
        type: boolean
        default: true
      run_tests:
        description: 'تشغيل الاختبارات'
        type: boolean
        default: true

jobs:
  analyze:
    name: تحليل الشيفرة
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      # قناة stable تضمن أحدث إصدار مستقر (يحتاج المشروع Dart ‏3.8.1 أو أحدث)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: معلومات البيئة
        run: flutter --version
      - name: تحضير الحزم
        run: flutter pub get
      - name: التحليل
        run: |
          flutter analyze 2>&1 | tee "$RUNNER_TEMP/analyze.txt" || true
      - name: الاختبارات
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          flutter test --reporter expanded 2>&1 | tee "$RUNNER_TEMP/test.txt" || true
      # ينشر ملخّص التحليل/الاختبارات كتعليق على الـ commit لأن سجلات Actions غير قابلة للقراءة من بيئة التطوير.
      - name: نشر تقرير الفشل
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ANALYZE_LOG: ${{ runner.temp }}/analyze.txt
          TEST_LOG: ${{ runner.temp }}/test.txt
        run: |
          python3 <<'PY'
          import json, os, subprocess

          def read(path):
              if not os.path.exists(path):
                  return ''
              with open(path, encoding='utf-8', errors='replace') as fh:
                  return fh.read()

          analyze = read(os.environ['ANALYZE_LOG'])
          tests = read(os.environ['TEST_LOG'])
          issues, seen = [], set()
          for line in analyze.splitlines():
              if ' • ' not in line:
                  continue
              key = line.strip()
              if key in seen:
                  continue
              seen.add(key)
              issues.append(key)
          body = 'عدد ملاحظات التحليل: %d\n\n%s' % (len(issues), '\n'.join(issues[:80]))
          if not issues and analyze.strip():
              body += '\n--- مخرجات التحليل ---\n' + analyze[-2000:]
          body += '\n\n--- مخرجات الاختبارات ---\n' + tests[-3000:]
          data = json.dumps({'body': 'تقرير CI\n\n```\n' + body[-10000:] + '\n```'})
          url = ('https://api.github.com/repos/%s/commits/%s/comments'
                 % (os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA']))
          subprocess.run(['curl', '-sS', '-X', 'POST',
                          '-H', 'Authorization: Bearer ' + os.environ['GITHUB_TOKEN'],
                          '-H', 'Accept: application/vnd.github+json', url, '-d', data], check=False)
          PY

  apk:
    name: بناء APK
    needs: analyze
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: تحضير الحزم
        run: flutter pub get
      - name: بناء نسخة الإصدار
        run: flutter build apk --release
      - name: رفع الملف
        uses: actions/upload-artifact@v4
        with:
          name: injazi-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
