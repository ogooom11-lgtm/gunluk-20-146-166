name: CI

on:
  push:
    branches:
      - '**'
  workflow_dispatch:
    inputs:
      build_apk:
        description: 'بناء ملف APK للتحميل'
        type: boolean
        default: true
      run_tests:
        description: 'تشغيل الاختبارات'
        type: boolean
        default: true

jobs:
  analyze:
    name: تحليل الشيفرة
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      REPORT: ${{ runner.temp }}/report.txt
    steps:
      - uses: actions/checkout@v4
      # قناة stable تضمن أحدث إصدار مستقر (يحتاج المشروع Dart ‏3.8.1 أو أحدث)
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: معلومات البيئة
        run: flutter --version
      - name: تحضير الحزم
        run: flutter pub get
      - name: التحليل
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee -a "$REPORT" || echo "analyze_exit=$?" | tee -a "$REPORT"
      - name: الاختبارات
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.run_tests }}
        run: |
          set -o pipefail
          flutter test --reporter expanded 2>&1 | tee -a "$REPORT" || echo "test_exit=$?" | tee -a "$REPORT"
      # ينشر مخرجات التحليل/الاختبارات كتعليق على الـ commit لأن سجلات Actions غير قابلة للقراءة من بيئة التطوير.
      - name: نشر تقرير الفشل
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s "$REPORT" ]; then echo "لا يوجد تقرير"; exit 0; fi
          python3 - "$REPORT" <<'PY'
          import json, os, subprocess, sys
          raw = open(sys.argv[1], encoding='utf-8', errors='replace').read()
          body = raw[-6000:]
          payload = json.dumps({'body': 'تقرير CI\n\n```\n' + body + '\n```'})
          url = 'https://api.github.com/repos/%s/commits/%s/comments' % (os.environ['GITHUB_REPOSITORY'], os.environ['GITHUB_SHA'])
          subprocess.run(['curl', '-sS', '-X', 'POST', '-H', 'Authorization: Bearer ' + os.environ['GITHUB_TOKEN'],
                          '-H', 'Accept: application/vnd.github+json', url, '-d', payload], check=False)
          PY

  apk:
    name: بناء APK
    needs: analyze
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: تحضير الحزم
        run: flutter pub get
      - name: بناء نسخة الإصدار
        run: flutter build apk --release
      - name: رفع الملف
        uses: actions/upload-artifact@v4
        with:
          name: injazi-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30
