name: gunluk
description: "إنجازي — تطبيق عربي أنيق لمتابعة الإنجازات والأهداف اليومية، مع خطط متكررة وتقويم وتذكيرات ذكية."
publish_to: 'none'

# رقم الإصدار والبناء — يظهر داخل التطبيق في شاشة "حول التطبيق"
version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  # ترجمات واتجاه الواجهة (عربي/إنجليزي + RTL)
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # تخزين محلي (بدون إنترنت) لكل البيانات والإعدادات
  shared_preferences: ^2.2.3

  # الإشعارات المجدولة (تذكير النهاية اليومية، تذكير الخطة، التنبيهات المتكررة)
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.0

  # بصمات SHA-256 و HMAC لاشتقاق مفاتيح التشفير (نسخة احتياطية مشفّرة + قفل بكلمة سر)
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Cairo
      fonts:
        - asset: assets/fonts/Cairo-Regular.ttf
          weight: 400
        - asset: assets/fonts/Cairo-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Cairo-Bold.ttf
          weight: 700
    - family: ReadexPro
      fonts:
        - asset: assets/fonts/ReadexPro-Regular.ttf
          weight: 400
        - asset: assets/fonts/ReadexPro-Medium.ttf
          weight: 500
        - asset: assets/fonts/ReadexPro-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/ReadexPro-Bold.ttf
          weight: 700
