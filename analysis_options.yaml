# قواعد التحليل الثابت للمشروع.
# لتشغيل الفحص محليًا:  flutter analyze
include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # الشيفرة تتحقّق من الجَبل (mounted/context.mounted) قبل استخدام الواجهة بعد
    # العمليات غير المتزامنة، لكن الفحص واسع جدًا مع الحوارات والأوراق المنبثقة.
    use_build_context_synchronously: ignore
    # استخدام (_، __) في المُنشِئات (مثل separatorBuilder) مقصود وواضح.
    unnecessary_underscores: ignore
    # بعض الرسوم تحتاج SizedBox بلا أبعاد (للتوسيط فقط).
    sized_box_for_whitespace: ignore
    # عناصر واجهة خاصة تُستخدم داخل نفس الملف فقط.
    library_private_types_in_public_api: ignore

linter:
  rules:
    # قواعد مقصود تعطيلها لتبقى الشيفرة قابلة للقراءة في هذا المشروع
    prefer_const_constructors: false
    prefer_const_literals_to_create_immutables: false
    prefer_const_declarations: false
    prefer_const_constructors_in_immutables: false
    sort_child_properties_last: false
